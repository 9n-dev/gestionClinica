version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Parches y versiones menores, agrupados en una sola PR semanal; el CI (lint, tests y e2e) dice si se puede mezclar.
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Los saltos de versión mayor (Next, React, Prisma, pero también TypeScript o ESLint) se deciden a mano:
      # en la primera pasada, tres de cuatro rompían el CI.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
